name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example 0.2.2)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate version and artifacts
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          test -s manifest.json
          test -s dist/main.js
          test -s dist/styles.css
          test -s versions.json

          version="$(node -p "require('./manifest.json').version")"
          # Obsidian looks up the release whose tag equals the manifest version, so a
          # "v" prefix would make the plugin uninstallable. Compare the tag verbatim.
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "manifest version ($version) does not match tag ($RELEASE_TAG)" >&2
            exit 1
          fi

          node -e "
            const m = require('./manifest.json');
            if (!m.id || !m.name || m.isDesktopOnly !== true) {
              console.error('manifest.json must have id/name and isDesktopOnly=true');
              process.exit(1);
            }
            const versions = require('./versions.json');
            if (!versions[m.version]) {
              console.error('versions.json has no entry for ' + m.version);
              process.exit(1);
            }
          "

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version from tag $RELEASE_TAG"

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp manifest.json release/
          cp dist/main.js release/
          cp dist/styles.css release/
          ls -lh release

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release/main.js
            release/styles.css
            release/manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release/manifest.json \
            release/main.js \
            release/styles.css \
            --title "Visible Git Graph $VERSION" \
            --generate-notes \
            --verify-tag
